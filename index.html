<html lang="fr">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<style>
  :root{
    --ink:#12161F;
    --ink-2:#191E2A;
    --ink-3:#222836;
    --paper:#EFEBE0;
    --paper-dim:#B9B4A4;
    --brass:#C6A15B;
    --brass-dim:#8A733F;
    --line:#333A4A;
    --ok:#7FA687;
    --font-display:"Fraunces", serif;
    --font-body:"Inter", sans-serif;
    --font-mono:"IBM Plex Mono", monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  ::selection{background:var(--brass); color:var(--ink);}
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:3px;
  }

  .wrap{max-width:920px; margin:0 auto; padding:0 28px;}

  /* NAV */
  nav.topnav{
    position:sticky; top:0; z-index:20;
    background:rgba(18,22,31,0.86);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .topnav-inner{
    max-width:920px; margin:0 auto; padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand-mark{
    font-family:var(--font-mono); font-size:13px; letter-spacing:0.08em;
    color:var(--brass); text-decoration:none;
  }
  .navlinks{display:flex; gap:26px; list-style:none; margin:0; padding:0;}
  .navlinks a{
    font-family:var(--font-mono); font-size:12.5px; letter-spacing:0.04em;
    text-decoration:none; color:var(--paper-dim);
    transition:color 0.2s;
  }
  .navlinks a:hover{color:var(--brass);}
  .navlinks{display:none;}
  @media(min-width:640px){.navlinks{display:flex;}}
  .nav-right{display:flex; align-items:center; gap:22px;}
  .social-links{display:flex; align-items:center; gap:14px;}
  .social-links a{
    display:flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:2px;
    border:1px solid var(--line); color:var(--paper-dim);
    text-decoration:none; transition:all 0.2s;
  }
  .social-links a:hover{border-color:var(--brass); color:var(--brass);}
  .social-links svg{width:15px; height:15px;}

  /* HERO */
  .hero{
    padding:96px 0 72px;
    position:relative;
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .hero-grid{
    position:absolute; inset:0; opacity:0.5;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,0.9), transparent 85%);
    mask-image:linear-gradient(to bottom, rgba(0,0,0,0.9), transparent 85%);
    pointer-events:none;
  }
  .hero-inner{position:relative;}
  .eyebrow{
    font-family:var(--font-mono); font-size:12.5px; color:var(--brass);
    letter-spacing:0.12em; text-transform:uppercase;
    display:flex; align-items:center; gap:10px; margin-bottom:22px;
  }
  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--ok);}
  h1.hero-title{
    font-family:var(--font-display); font-weight:500; font-size:clamp(38px,7vw,64px);
    line-height:1.04; margin:0 0 18px; letter-spacing:-0.01em;
  }
  h1.hero-title .accent{color:var(--brass); font-style:italic;}
  .hero-role{
    font-family:var(--font-body); font-weight:400; font-size:clamp(17px,2.4vw,21px);
    color:var(--paper-dim); max-width:560px; line-height:1.5; margin:0 0 34px;
  }
  .hero-meta{
    display:flex; flex-wrap:wrap; gap:10px 22px;
    font-family:var(--font-mono); font-size:13px; color:var(--paper-dim);
  }
  .hero-meta span{display:flex; align-items:center; gap:8px;}
  .hero-actions{margin-top:38px; display:flex; gap:14px; flex-wrap:wrap;}
  .avatar{
    width:104px; height:104px; border-radius:6px; object-fit:cover;
    border:1px solid var(--line); margin-bottom:28px;
    filter:grayscale(15%);
  }

  /* PROJECTS */
  .projects-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:22px;}
  .project-card{
    border:1px solid var(--line); border-radius:2px; padding:24px;
    transition:border-color 0.2s;
  }
  .project-card:hover{border-color:var(--brass);}
  .project-card h3{font-family:var(--font-display); font-size:20px; margin:0 0 8px;}
  .project-card p{font-size:14px; color:var(--paper-dim); line-height:1.55; margin:0 0 14px;}
  .project-link{
    font-family:var(--font-mono); font-size:12.5px; color:var(--brass);
    text-decoration:none; border-bottom:1px solid var(--brass-dim);
  }
  .project-link:hover{border-color:var(--brass);}
  .btn{
    font-family:var(--font-mono); font-size:13px; text-decoration:none;
    padding:12px 22px; border-radius:2px; letter-spacing:0.02em;
    transition:all 0.2s; border:1px solid var(--brass);
  }
  .btn.primary{background:var(--brass); color:var(--ink); font-weight:500;}
  .btn.primary:hover{background:#D8B372;}
  .btn.ghost{color:var(--brass); border-color:var(--line);}
  .btn.ghost:hover{border-color:var(--brass);}

  /* SECTION */
  section{padding:76px 0; border-bottom:1px solid var(--line);}
  section:last-of-type{border-bottom:none;}
  .sec-head{display:flex; align-items:baseline; gap:16px; margin-bottom:40px;}
  .sec-num{font-family:var(--font-mono); font-size:13px; color:var(--brass-dim);}
  h2.sec-title{
    font-family:var(--font-display); font-weight:500; font-size:clamp(26px,4vw,34px);
    margin:0;
  }

  /* ABOUT */
  .about-text{
    font-family:var(--font-display); font-size:clamp(19px,2.6vw,24px);
    line-height:1.55; font-weight:400; color:var(--paper); max-width:740px;
  }
  .about-stats{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:20px; margin-top:48px;
  }
  .stat{border-left:1px solid var(--brass); padding-left:16px;}
  .stat-num{font-family:var(--font-display); font-size:30px; color:var(--brass);}
  .stat-label{font-family:var(--font-mono); font-size:12px; color:var(--paper-dim); margin-top:4px;}

  /* CHANGELOG / EXPERIENCE */
  .changelog{position:relative;}
  .release{
    position:relative; padding:0 0 44px 28px;
    border-left:1px solid var(--line);
  }
  .release:last-child{padding-bottom:0;}
  .release::before{
    content:""; position:absolute; left:-5px; top:6px;
    width:9px; height:9px; border-radius:50%;
    background:var(--ink); border:2px solid var(--brass);
  }
  .release-head{
    display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:6px;
  }
  .tag{
    font-family:var(--font-mono); font-size:12px; color:var(--ink);
    background:var(--brass); padding:2px 9px; border-radius:2px; font-weight:500;
  }
  .release-role{font-family:var(--font-display); font-size:21px; font-weight:500; margin:0;}
  .release-period{font-family:var(--font-mono); font-size:12.5px; color:var(--paper-dim);}
  .release-project{
    font-family:var(--font-body); font-size:14.5px; color:var(--paper-dim); font-style:italic;
    margin:4px 0 14px;
  }
  ul.changes{list-style:none; margin:0; padding:0;}
  ul.changes li{
    position:relative; padding-left:22px; margin-bottom:9px;
    font-size:14.5px; line-height:1.55; color:#D9D5C8;
  }
  ul.changes li::before{
    content:"+"; position:absolute; left:0; color:var(--ok);
    font-family:var(--font-mono); font-weight:600;
  }
  .stack-line{
    margin-top:14px; font-family:var(--font-mono); font-size:12px;
    color:var(--brass-dim);
  }

  /* SKILLS */
  .skills-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:32px;}
  .skill-group h3{
    font-family:var(--font-mono); font-size:12.5px; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--brass); margin:0 0 14px;
  }
  .skill-tags{display:flex; flex-wrap:wrap; gap:8px;}
  .skill-tag{
    font-family:var(--font-mono); font-size:12.5px; color:var(--paper-dim);
    border:1px solid var(--line); padding:5px 10px; border-radius:2px;
  }

  /* EDUCATION */
  .edu-item{display:flex; gap:22px; align-items:baseline;}
  .edu-year{font-family:var(--font-mono); font-size:15px; color:var(--brass); min-width:56px;}
  .edu-title{font-family:var(--font-display); font-size:19px; margin:0 0 4px;}
  .edu-sub{font-size:14px; color:var(--paper-dim); margin:0;}
  .edu-item + .edu-item{margin-top:22px;}

  /* CONTACT */
  .contact-title{
    font-family:var(--font-display); font-weight:500; font-size:clamp(30px,5vw,46px);
    margin:0 0 24px; max-width:640px; line-height:1.15;
  }
  .contact-links{display:flex; flex-direction:column; gap:16px; margin-top:32px;}
  .contact-links a{
    display:inline-flex; align-items:center; gap:12px;
    font-family:var(--font-mono); font-size:16px; text-decoration:none;
    color:var(--paper); width:fit-content; border-bottom:1px solid var(--line); padding-bottom:4px;
    transition:border-color 0.2s, color 0.2s;
  }
  .contact-links a:hover{color:var(--brass); border-color:var(--brass);}

  footer{padding:32px 0; text-align:center;}
  footer p{font-family:var(--font-mono); font-size:11.5px; color:var(--paper-dim); margin:0;}
</style>
</head>
